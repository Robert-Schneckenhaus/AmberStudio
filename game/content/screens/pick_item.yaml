# Choose one of the carried items. Call: push_screen(S.pick_item, 0, 1, T.title). Result: the item ID, 0 if cancelled.
screen: pick_item
extends: window_modal
transparent: false
args: [title]
region: { at: [8, 80], size: [304, 112] }
nodes:
  - window:   { id: frame,  at: [0, 0],   size_tiles: [19, 7] }
  - label:    { id: title,  at: [8, 4],   text: "$title", color: 1 }
  - label:    { id: gold,   at: [224, 4], bind: "party.gold", color: 1 }
  - itemgrid: { id: items,  at: [8, 14],  size: [284, 44], cols: 14, rows: 2, source: "party.items", on_select: pick }
  - label:    { id: name,   at: [8, 62],  bind: "items.name", color: 1 }
  - label:    { id: detail, at: [8, 72],  bind: "items.detail", color: 3 }
  - button:   { id: cancel, at: [8, 90],  text: T.btn_back, hotkey: esc, on_click: cancel }
