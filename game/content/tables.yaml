  ina_greet:
    speaker: Ina
    text: "Hello, traveller! Lovely day, isn't it?"
  ina_name:
    speaker: Ina
    text: "I'm Ina. I look after this meadow, and I patch up whoever comes out of that cellar."
  ina_meadow:
    speaker: Ina
    text: "The meadow is quiet. Only the cellar gives us trouble."
  ina_cellar:
    speaker: Ina
    text: "Rats have moved into the old cellar. Clear them out and I'll come along with you."
  ina_cellar_done:
    speaker: Ina
    text: "You chased the rats away! As promised, I'm coming with you."
  ina_default:
    speaker: Ina
    text: "Hm? Ask me about the meadow or the cellar."
  ina_apple:
    speaker: Ina
    text: "An apple for me? Thank you!"
  cellar_arrival:
